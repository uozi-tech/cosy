name: Code Check

on:
  push:
    branches:
      - main
      - '**'
    paths:
      - "**/*.go"
      - "go.mod"
      - ".github/workflows/notify.yml"
      - ".github/workflows/go.yml"

  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - "**/*.go"
      - "go.mod"
      - ".github/workflows/notify.yml"
      - ".github/workflows/go.yml"

  schedule:
    # Run the adversarial fuzz targets for longer than is practical on every PR.
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: drone
          POSTGRES_USER: drone
          POSTGRES_PASSWORD: drone
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U drone" --health-interval=5s --health-timeout=5s --health-retries=5
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Configure environment
        run: |
          echo '[app]
          PageSize = 20
          JwtSecret = c87047ba-f40b-447f-8da5-24ca617dca9a
          [server]
          Host = 127.0.0.1
          Port = 0
          RunMode = debug
          [database]
          User = drone
          Password = drone
          Host = 127.0.0.1
          Port = 5432
          Name = drone
          [redis]
          Addr = 127.0.0.1:6379
          Password =
          DB = 0
          Prefix = cosy' > app.ini

      - name: Run tests
        run: |
          go test -coverprofile=coverage.out ./...

      - name: Display test coverage
        run: go tool cover -func=coverage.out

  vulnerability:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  fuzz:
    name: Fuzz ${{ matrix.target }}
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./map2struct
            target: FuzzWeakDecodeNeverPanics
          - package: ./internal/rulecheck
            target: FuzzValidateMapNeverPanics
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run fuzz target for 10 minutes
        run: go test ${{ matrix.package }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=10m
